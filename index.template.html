<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2693E">
<title>Giappone · Guida</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#26252A; --paper:#FAF6EF; --grey:#837C72; --bg:#FFFFFF; --card:#FFFFFF; --line:#E8E2D8;
  --tokyo:#C2693E; --kyoto:#6E8B4F; --osaka:#BC5B39; --okinawa:#2E8C92;
  --akiba:#6F5274; --shibuya:#2F7E78; --harajuku:#C26B82; --shinjuku:#C2693E; --ginza:#AE8A3C;
  --ueno:#5E7D52; --odaiba:#3F7CA0; --minato:#B24A43; --setagaya:#B07645; --kamakura:#3A6E66;
  --fushimi:#C0613B; --naha:#C98A3A;
}
/* tema scuro: automatico (in base al sistema) o forzato con data-theme */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#ECE8E1; --paper:#17161A; --grey:#9A938A; --bg:#131217; --card:#1E1D23; --line:#312F38; }
}
:root[data-theme="dark"]{ --ink:#ECE8E1; --paper:#17161A; --grey:#9A938A; --bg:#131217; --card:#1E1D23; --line:#312F38; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",Roboto,-apple-system,"Noto Sans",sans-serif; font-size:16px}
.jp{font-family:"Yu Gothic","Noto Sans CJK JP","Hiragino Sans",sans-serif}
#app{max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:100px}
a{color:inherit}
body.noscroll{overflow:hidden}

/* ---------- header ---------- */
.tophead{position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--bg) 86%, transparent); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px}
.tophead .back{border:0; background:var(--card); border:1px solid var(--line); color:var(--ink);
  width:38px; height:38px; border-radius:12px; font-size:19px; cursor:pointer; flex:0 0 auto}
.tophead h1{font-size:18px; margin:0; font-weight:700; line-height:1.15}
.tophead .sub{font-size:12px; color:var(--grey); margin-top:1px}
.crumb{flex:1; min-width:0}
.crumb h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- hero home ---------- */
.hero{padding:34px 20px 10px; text-align:center}
.hero .flag{width:56px;height:56px;border-radius:50%;background:#B24A43;margin:0 auto 12px;
  box-shadow:0 0 0 6px color-mix(in srgb,#B24A43 18%,transparent)}
.hero h1{font-size:30px; margin:0; letter-spacing:1px}
.hero p{color:var(--grey); margin:6px 0 0; font-size:14px}
.searchwrap{padding:16px 16px 4px}
.searchwrap input{width:100%; padding:12px 16px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font-size:15px; outline:none}
.searchwrap input:focus{border-color:var(--tokyo)}

/* ---------- cards ---------- */
.grid{padding:12px 14px; display:flex; flex-direction:column; gap:12px}
.citycard{display:flex; align-items:center; gap:14px; padding:16px; border-radius:18px; border:1px solid var(--line);
  background:var(--card); cursor:pointer; transition:transform .08s; position:relative; overflow:hidden}
.citycard:active{transform:scale(.98)}
.citycard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c)}
.citycard .glyph{font-size:30px; width:58px; height:58px; border-radius:16px; background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c); display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 auto}
.citycard b{font-size:19px}
.citycard .d{font-size:13px; color:var(--grey); margin-top:2px; line-height:1.35}
.citycard .n{font-size:11.5px; color:var(--c); font-weight:700; margin-top:5px}
.zonecard{border-radius:16px}
.zonecard .glyph{font-size:15px}

/* ---------- filter bar ---------- */
.filters{position:sticky; top:59px; z-index:40; background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px); padding:10px 14px 8px; border-bottom:1px solid var(--line)}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:600; cursor:pointer}
.chip.on{background:var(--zc,var(--tokyo)); border-color:var(--zc,var(--tokyo)); color:#fff}
.fhint{font-size:11px; color:var(--grey); margin:2px 2px 0}

/* ---------- place card ---------- */
.place{border:1px solid var(--line); border-left:4px solid var(--zc); border-radius:16px;
  background:var(--card); padding:14px 14px 12px; position:relative}
.place .head{display:flex; gap:11px; align-items:flex-start}
.pbadge{width:42px; height:42px; border-radius:50%; background:var(--zc); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center}
.pbadge img{width:24px; height:24px; display:block}
.place b.nm{font-size:16.5px; display:block; line-height:1.25}
.place .jp{font-size:12px; color:var(--grey)}
.place .must{position:absolute; top:-9px; right:12px; background:var(--zc); color:#fff; font-size:10.5px;
  font-weight:800; border-radius:999px; padding:3px 9px; letter-spacing:.5px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 0}
.tag{font-size:11px; font-weight:700; border-radius:6px; padding:2.5px 7px;
  background:color-mix(in srgb,var(--zc) 12%,transparent); color:var(--zc)}
.tag.t{background:color-mix(in srgb,var(--grey) 14%,transparent); color:var(--grey)}
.place p.desc{margin:9px 0 0; font-size:14px; line-height:1.5}
.place details{margin-top:7px; font-size:13.5px; line-height:1.45}
.place details summary{cursor:pointer; color:var(--zc); font-weight:700; font-size:13px; user-select:none}
.place details p{margin:5px 0 0; color:var(--ink)}
.price{margin-top:8px; font-size:13px; background:color-mix(in srgb,var(--zc) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--zc) 25%,transparent); border-radius:9px; padding:6px 10px}
.mapsbtn{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:11px;
  background:var(--zc); color:#fff; text-decoration:none; font-weight:700; font-size:14.5px;
  border-radius:12px; padding:11px; transition:filter .1s}
.mapsbtn:active{filter:brightness(.9)}
.zonehead{margin:14px 14px 0; border-radius:18px; background:var(--zc); color:#fff; padding:16px}
.zonehead .jp{color:rgba(255,255,255,.75); font-size:13px}
.zonehead h2{margin:0 0 2px; font-size:21px}
.zonehead .sub{font-size:13px; color:rgba(255,255,255,.85); line-height:1.4}
.zonehead a.zmaps{display:inline-flex; align-items:center; gap:6px; margin-top:10px; color:#fff; background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.45); text-decoration:none; font-size:13px; font-weight:700; border-radius:999px; padding:6px 13px}
.empty{padding:40px 20px; text-align:center; color:var(--grey); font-size:14px}
.count{padding:6px 16px 0; font-size:12px; color:var(--grey)}

/* ---------- foto ---------- */
.citycard.hasimg{padding:0; min-height:118px; align-items:stretch}
.citycard.hasimg .imgside{flex:0 0 118px; background-size:cover; background-position:center}
.citycard.hasimg .txt{padding:14px 14px 12px; flex:1; min-width:0}
.zonecard .thumb{flex:0 0 74px; height:74px; border-radius:14px; background-size:cover; background-position:center; margin:0}
.zbanner{margin:14px 14px 0; border-radius:18px; overflow:hidden; position:relative; color:#fff;
  background:var(--zc); min-height:150px; display:flex; align-items:flex-end}
.zbanner .bg{position:absolute; inset:0; background-size:cover; background-position:center}
.zbanner .shade{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.62))}
.zbanner .in{position:relative; padding:14px 16px; width:100%}
.zbanner h2{margin:0 0 2px; font-size:22px; text-shadow:0 1px 8px rgba(0,0,0,.5)}
.zbanner .jp{color:rgba(255,255,255,.85); font-size:13px}
.zbanner .sub{font-size:13px; color:rgba(255,255,255,.92); line-height:1.4; text-shadow:0 1px 6px rgba(0,0,0,.6)}
.zbanner a.zmaps{display:inline-flex; align-items:center; gap:6px; margin-top:9px; color:#fff; background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.5); text-decoration:none; font-size:13px; font-weight:700; border-radius:999px; padding:6px 13px}
.credit{position:absolute; top:8px; right:10px; font-size:9.5px; color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.35); border-radius:6px; padding:2px 6px}

/* ---------- toggle tema ---------- */
.themebtn{border:1.5px solid var(--line); background:var(--card); color:var(--ink); width:38px; height:38px;
  border-radius:12px; font-size:17px; cursor:pointer; flex:0 0 auto}
.herotop{position:absolute; top:12px; right:14px}
.hero{position:relative}

/* ---------- FAB + aggiungi luogo ---------- */
.fab{position:fixed; right:18px; bottom:22px; z-index:120; width:60px; height:60px; border-radius:50%;
  border:0; background:var(--tokyo); color:#fff; font-size:33px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,.30)}
.fab:active{transform:scale(.93)}
.delp{position:absolute; top:9px; right:10px; background:transparent; border:0; font-size:17px; cursor:pointer; opacity:.55; padding:2px}
.delp:active{opacity:1}
.tag.mine{background:color-mix(in srgb,var(--zc) 20%,transparent); color:var(--zc)}
.modal{position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow:auto;
  border-radius:22px 22px 0 0; padding:16px 16px 22px; animation:sheetup .24s ease}
@keyframes sheetup{from{transform:translateY(100%)} to{transform:none}}
.sheet h2{margin:2px 0 6px; font-size:20px}
.sheet label{display:block; font-size:12.5px; font-weight:700; color:var(--grey); margin:13px 2px 5px}
.sheet input,.sheet textarea,.sheet select{width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font-size:15px; font-family:inherit; outline:none}
.sheet textarea{min-height:62px; resize:vertical}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--tokyo)}
.formchips{display:flex; flex-wrap:wrap; gap:7px}
.formrow{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; position:sticky; bottom:-22px;
  background:var(--bg); padding:12px 0 0}
.btn{border:0; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:700; cursor:pointer}
.btn.ghost{background:transparent; color:var(--grey)}
.btn.save{background:var(--tokyo); color:#fff}
footer{margin-top:34px; text-align:center; font-size:11.5px; color:var(--grey); padding:0 20px; line-height:1.6}
.view{animation:slidein .22s ease}
@keyframes slidein{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab" class="fab" title="Aggiungi un luogo" onclick="openAdd()">+</button>
<div id="modal" class="modal" hidden onclick="closeAdd()"></div>
<script>
/* ============ ICONE (PNG bianche della guida, base64) ============ */
const ICONS = {
  torii:"@@ICON_torii@@", shop:"@@ICON_shop@@", camera:"@@ICON_camera@@", cup:"@@ICON_cup@@",
  yen:"@@ICON_yen@@", walk:"@@ICON_walk@@", train:"@@ICON_train@@", bulb:"@@ICON_bulb@@",
  pin:"@@ICON_pin@@", star:"@@ICON_star@@", clock:"@@ICON_clock@@", station:"@@ICON_station@@"
};

/* ============ DATABASE (estratto dalla guida PDF) ============ */
/* cat: cibo | visita | shopping | chicca   ·   when: mattina | giorno | sera */
const P=(icon,n,jp,cat,when,d,o={})=>({icon,n,jp,cat,when,d,...o});
const DATA={cities:[
{id:'tokyo',name:'Tokyo',jp:'東京',color:'var(--tokyo)',hex:'#C2693E',
 desc:'La megalopoli: otaku, neon, templi e parchi.',zones:[
 {id:'akiba',name:'Akihabara',jp:'秋葉原',c:'--akiba',sub:'Elettronica, retrogaming e cultura otaku. Meglio nel tardo pomeriggio, quando si accendono le insegne.',q:'Akihabara Electric Town Tokyo',places:[
  P('torii','Akihabara Electric Town','秋葉原電気街',['visita'],['sera'],'Palazzi di 7–8 piani stipati di elettronica, anime e sale giochi. Al buio le insegne trasformano la via.',{must:1,curio:'Nel dopoguerra qui c’era il mercato nero dei componenti radio: da lì "Electric Town".',q:'Akihabara Electric Town'}),
  P('shop','Super Potato','スーパーポテト',['shopping'],['giorno'],'La mecca del retrogaming: tre piani di console e cartucce dagli anni ’80, con sala arcade vintage in cima.',{q:'Super Potato Akihabara'}),
  P('shop','Mandarake Complex','まんだらけ',['shopping'],['giorno'],'Otto piani di manga, figure, dōjinshi e cimeli usati.',{q:'Mandarake Complex Akihabara'}),
  P('shop','Yodobashi Akiba','ヨドバシAkiba',['shopping'],['giorno'],'Megastore di nove piani. Aria condizionata salvavita nelle ore calde; chiedi la point card (10%).',{tip:'Nello stesso edificio: ABC-MART Mega e UNIQLO.',q:'Yodobashi Akiba'}),
  P('shop','Don Quijote Akihabara','ドン・キホーテ',['shopping'],['sera'],'Il labirinto del "Donki": souvenir assurdi e cosmetici fino a tardi. In alto il teatro delle AKB48.',{q:'Don Quijote Akihabara'}),
  P('torii','Kanda Myōjin','神田明神',['visita','chicca'],['mattina'],'Il santuario che "benedice" i dispositivi elettronici, a 7 minuti dalla via principale.',{q:'Kanda Myojin Tokyo'}),
  P('shop','Radio Kaikan','ラジオ会館',['shopping'],['giorno'],'Dieci piani di action figure e card.',{q:'Radio Kaikan Akihabara'}),
  P('shop','Suruga-ya','駿河屋',['shopping'],['giorno'],'Retrogaming e usato otaku.',{q:'Surugaya Akihabara'}),
  P('shop','TAMASHII NATIONS','タマシイネイションズ',['shopping'],['giorno'],'Flagship Bandai per le figure da collezione.',{q:'TAMASHII NATIONS Store Tokyo'}),
  P('shop','Hobby Base Yellow Submarine','イエローサブマリン',['shopping'],['giorno'],'Gunpla e modellismo.',{q:'Yellow Submarine Akihabara'}),
  P('shop','General Store Railyard','レールヤード',['shopping','chicca'],['giorno'],'Modellismo ferroviario e oggetti "da stazione": qui trovi i cartelli giapponesi veri.',{q:'General Store Railyard Akihabara'}),
  P('shop','BicCamera Akiba + DAISO','ビックカメラ',['shopping'],['giorno'],'Elettronica e il tutto-a-100¥.',{q:'Bic Camera AKIBA'}),
  P('shop','Nakano Broadway','中野ブロードウェイ',['shopping','chicca'],['giorno'],'Fuori zona (pochi minuti da Shinjuku): palazzo-labirinto otaku, Mandarake su molti piani. Tutto al chiuso: perfetto col caldo.',{q:'Nakano Broadway Tokyo'})]},
 {id:'shibuya',name:'Shibuya',jp:'渋谷',c:'--shibuya',sub:'Pop culture e l’incrocio più famoso del mondo. Nintendo, Pokémon e One Piece nello stesso edificio.',q:'Shibuya Tokyo',places:[
  P('star','Statua di Hachikō','ハチ公像',['visita'],['mattina','giorno','sera'],'Il punto d’incontro di Tokyo. Piccola, sempre circondata, irrinunciabile.',{curio:'Hachikō aspettò il padrone alla stazione per quasi 10 anni. È il simbolo nazionale della fedeltà.',q:'Hachiko Statue Shibuya'}),
  P('camera','Shibuya Crossing','スクランブル交差点',['visita'],['sera'],'L’incrocio più attraversato del mondo. Dall’alto: secondo piano della stazione o Shibuya Sky.',{q:'Shibuya Crossing'}),
  P('shop','Shibuya PARCO — 6° piano','渋谷パルコ',['shopping'],['giorno'],'Nintendo Tokyo + Pokémon Center + One Piece Store sullo stesso piano ("Cyberspace Shibuya"). Un ascensore, tre tappe.',{must:1,tip:'Sali anche sul rooftop: vista gratuita sui grattacieli.',q:'Shibuya PARCO'}),
  P('shop','Mandarake Shibuya','まんだらけ渋谷',['shopping'],['giorno'],'Manga e figure usate in un seminterrato dall’estetica "catacomba".',{q:'Mandarake Shibuya'}),
  P('shop','MEGA Don Quijote','MEGAドンキ',['shopping'],['sera'],'Il Donki gigante: souvenir, snack e Kit Kat introvabili (matcha, wasabi, sake...).',{q:'MEGA Don Quijote Shibuya'}),
  P('shop','atmos / atmos pink','アトモス',['shopping'],['giorno'],'Sneaker ed edizioni "only Japan" (uomo e donna).',{q:'atmos Shibuya'}),
  P('shop','THE NORTH FACE LAB','ノースフェイスラボ',['shopping'],['giorno'],'La linea sperimentale del marchio.',{q:'THE NORTH FACE LAB Shibuya'}),
  P('shop','Loft Shibuya','ロフト渋谷',['shopping'],['giorno'],'Il tempio del lifestyle e della cancelleria.',{q:'Loft Shibuya'}),
  P('cup','Nonbei Yokochō','のんべい横丁',['cibo','chicca'],['sera'],'Il "vicolo dei bevitori": minuscoli izakaya sotto i binari, magico al tramonto.',{q:'Nonbei Yokocho Shibuya'})]},
 {id:'harajuku',name:'Harajuku · Yoyogi',jp:'原宿',c:'--harajuku',sub:'Moda kawaii, viali alberati e il verde di Meiji Jingū: parchi al mattino, negozi dopo.',q:'Harajuku Tokyo',places:[
  P('shop','Takeshita-dōri','竹下通り',['visita','shopping'],['giorno'],'La via della moda kawaii, folle e colorata. Parte davanti alla stazione.',{q:'Takeshita Street Harajuku'}),
  P('star','HARRY Otter Café','ハリー原宿',['chicca'],['giorno'],'Caffè con lontre, ricci e cincillà. Ingresso a tempo con bevanda.',{price:'da 1.500¥/30min',tip:'C’è un dibattito etico sugli animal café: se vai, scegli fasce poco affollate.',q:'HARRY Harajuku Terrace'}),
  P('torii','Meiji Jingū','明治神宮',['visita'],['mattina'],'Il santuario shintoista più importante di Tokyo, in una foresta di 100.000 alberi. Gratuito.',{must:1,tip:'Al mattino presto la foresta è fresca e quasi vuota: l’opposto della Takeshita a mezzogiorno.',q:'Meiji Jingu'}),
  P('camera','Parco Yoyogi','代々木公園',['visita'],['mattina'],'Prati, fontane e il grande albero-simbolo. La domenica: band e ballerini rockabilly.',{q:'Yoyogi Park'}),
  P('cup','Ginza West — Aoyama Garden','銀座ウエスト',['cibo'],['giorno'],'Sala da tè rétro (1947) con dehors nel verde: leaf pie e panna montata a mano. Niente musica, per chiacchierare.',{price:'1.000–2.000¥',q:'Ginza West Aoyama Garden'}),
  P('shop','Cat Street','キャットストリート',['visita','shopping'],['giorno'],'Collega Harajuku a Shibuya tra boutique e street brand.',{q:'Cat Street Harajuku'}),
  P('camera','Ōta Memorial Museum','太田記念美術館',['visita'],['giorno'],'Piccolo museo di stampe ukiyo-e. Fresco e al chiuso.',{q:'Ota Memorial Museum of Art'}),
  P('shop','Kapital (Ebisu)','キャピタル',['shopping'],['giorno'],'Il culto del denim giapponese tinto indaco, nella vicina Ebisu.',{q:'Kapital Ebisu Tokyo'})]},
 {id:'shinjuku',name:'Shinjuku',jp:'新宿',c:'--shinjuku',sub:'Neon, vicoli e la stazione più trafficata del pianeta. Zona perfetta per la sera.',q:'Shinjuku Tokyo',places:[
  P('camera','Tokyo Metropolitan Gov. Building','都庁',['visita'],['giorno','sera'],'Due osservatori gratuiti al 45° piano: la miglior vista gratis della città. Nelle giornate limpide si vede il Fuji.',{must:1,price:'Gratis',q:'Tokyo Metropolitan Government Building Observatory'}),
  P('shop','Don Quijote Kabukichō','ドンキ歌舞伎町',['shopping'],['sera'],'Nel cuore del quartiere del divertimento, aperto fino a tardissimo.',{q:'Don Quijote Shinjuku Kabukicho'}),
  P('camera','Testa di Godzilla','ゴジラヘッド',['chicca'],['sera'],'Svetta sul cinema Toho e a orari fissi "ruggisce". Omaggio al mostro nato qui vicino nel 1954.',{q:'Godzilla Head Shinjuku'}),
  P('shop','Shinjuku Marui Annex','マルイアネックス',['shopping'],['giorno'],'Edificio di anime, idol e pop-up a rotazione.',{q:'Shinjuku Marui Annex'}),
  P('cup','Omoide Yokochō','思い出横丁',['cibo'],['sera'],'Il "vicolo dei ricordi": spiedini, fumo e atmosfera Shōwa.',{q:'Omoide Yokocho Shinjuku'}),
  P('cup','Golden Gai','ゴールデン街',['cibo','chicca'],['sera'],'Oltre 200 bar grandi come stanzette.',{q:'Golden Gai Shinjuku'}),
  P('torii','Shinjuku Gyoen','新宿御苑',['visita'],['mattina'],'Parco con giardino giapponese, francese e inglese.',{price:'500¥',q:'Shinjuku Gyoen'}),
  P('cup','Yakiniku Rikimaru','焼肉力丸',['cibo'],['sera'],'All-you-can-eat di wagyu: scegli livello e durata (90/120 min). Top tier ~5.000¥.',{must:1,tip:'Prenota: senza, l’attesa può superare l’ora.',price:'~5.000¥ top tier',q:'Yakiniku Rikimaru Shinjuku'}),

/* ============ TEMA ============ */
function applyTheme(){
  const t=localStorage.getItem('theme')||'auto';
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
}
function cycleTheme(){
  const cur=localStorage.getItem('theme')||'auto';
  const next=cur==='auto'?'light':(cur==='light'?'dark':'auto');
  localStorage.setItem('theme',next); applyTheme(); render();
}
const themeIcon=()=>({auto:'🌗',light:'☀️',dark:'🌙'})[localStorage.getItem('theme')||'auto'];
applyTheme();

/* ============ APP ============ */
const CATS=[['cibo','🍜 Cibo'],['visita','⛩️ Visite'],['shopping','🛍️ Shopping'],['chicca','💡 Chicche']];
const WHENS=[['mattina','🌅 Mattina'],['giorno','☀️ Giorno'],['sera','🌙 Sera']];
const state={cat:null,when:null,q:''};
const app=document.getElementById('app');
const esc=s=>(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const mapsUrl=q=>/^https?:\/\//i.test(q) ? q : 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const findCity=id=>DATA.cities.find(c=>c.id===id);
const findZone=zid=>{for(const c of DATA.cities){const z=c.zones.find(z=>z.id===zid);if(z)return[c,z]}return[null,null]};

/* ---- luoghi aggiunti da te (salvati sul dispositivo) ---- */
const CATICON={cibo:'cup',visita:'torii',shopping:'shop',chicca:'bulb'};
function loadCustom(){try{return JSON.parse(localStorage.getItem('myplaces')||'[]')}catch(e){return[]}}
function saveCustom(a){localStorage.setItem('myplaces',JSON.stringify(a))}
function customFor(cid,zid){return loadCustom().filter(p=>p.cityId===cid&&p.zoneId===zid)}
window.delCustom=id=>{if(confirm('Eliminare questo luogo aggiunto da te?')){saveCustom(loadCustom().filter(p=>p.id!==id));render()}};
window.fcToggle=el=>el.classList.toggle('on');
function zoneOptions(sc,sz){
  return DATA.cities.map(c=>`<optgroup label="${c.name}">`+
    c.zones.map(z=>`<option value="${c.id}|${z.id}"${(c.id===sc&&z.id===sz)?' selected':''}>${z.name}</option>`).join('')+
    `</optgroup>`).join('');
}
window.openAdd=()=>{
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <h2>➕ Aggiungi un luogo</h2>
    <label>Nome *</label><input id="f_name" placeholder="Es. Il ramen di Taro">
    <label>Nome giapponese (facoltativo)</label><input id="f_jp" class="jp" placeholder="ラーメン">
    <label>In che zona?</label><select id="f_zone">${zoneOptions(h[0],h[1])}</select>
    <label>Tipologia</label>
    <div class="formchips" id="f_cats">${CATS.map(([k,l])=>`<button type="button" class="chip" data-v="${k}" onclick="fcToggle(this)">${l}</button>`).join('')}</div>
    <label>Quando conviene andarci (col caldo)</label>
    <div class="formchips" id="f_whens">${WHENS.map(([k,l])=>`<button type="button" class="chip" data-v="${k}" onclick="fcToggle(this)">${l}</button>`).join('')}</div>
    <label>Note / descrizione</label><textarea id="f_note" placeholder="Cosa c'è di bello, cosa mangiare, orari..."></textarea>
    <label>Curiosità (facoltativo)</label><textarea id="f_curio" placeholder="Una chicca, un aneddoto..."></textarea>
    <label>Prezzo (facoltativo)</label><input id="f_price" placeholder="Es. ~1.500¥">
    <label>Link Google Maps o nome da cercare</label><input id="f_maps" placeholder="Incolla il link di Maps, oppure il nome del posto">
    <div class="formrow">
      <button class="btn ghost" onclick="closeAdd()">Annulla</button>
      <button class="btn save" onclick="saveNew()">Salva</button>
    </div>
  </div>`;
  m.hidden=false; document.body.classList.add('noscroll');
  setTimeout(()=>document.getElementById('f_name').focus(),80);
};
window.closeAdd=()=>{document.getElementById('modal').hidden=true; document.body.classList.remove('noscroll')};
window.saveNew=()=>{
  const n=document.getElementById('f_name').value.trim();
  if(!n){alert('Dai un nome al luogo 🙂');return}
  const zv=document.getElementById('f_zone').value.split('|');
  const cats=[...document.querySelectorAll('#f_cats .chip.on')].map(c=>c.dataset.v);
  const whens=[...document.querySelectorAll('#f_whens .chip.on')].map(c=>c.dataset.v);
  const p={id:'c'+Date.now(),custom:true,cityId:zv[0],zoneId:zv[1],
    icon:CATICON[cats[0]]||'pin', n, jp:document.getElementById('f_jp').value.trim(),
    cat:cats.length?cats:['visita'], when:whens,
    d:document.getElementById('f_note').value.trim(),
    curio:document.getElementById('f_curio').value.trim()||undefined,
    price:document.getElementById('f_price').value.trim()||undefined,
    q:document.getElementById('f_maps').value.trim()||n};
  const a=loadCustom(); a.push(p); saveCustom(a);
  closeAdd();
  location.hash='#/'+zv[0]+'/'+zv[1];
  render();
};

function nav(hash){location.hash=hash}
window.addEventListener('hashchange',render);
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeAdd()});

function header(title,sub,backHash){
  return `<div class="tophead">
    ${backHash!==null?`<button class="back" onclick="nav('${backHash}')">←</button>`:''}
    <div class="crumb"><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>
    <button class="themebtn" onclick="cycleTheme()" title="Tema">${themeIcon()}</button>
  </div>`;
}
const ph=id=>PHOTOS[id]||null;

function placeCard(p,zc,cityName){
  const S=t=>p.custom?esc(t):t;   // testo utente = escapato; testo guida = HTML consentito
  const cats=(p.cat||[]).map(c=>`<span class="tag">${(CATS.find(x=>x[0]===c)||[,''])[1]}</span>`).join('');
  const when=(p.when||[]).map(w=>`<span class="tag t">${(WHENS.find(x=>x[0]===w)||[,''])[1]}</span>`).join('');
  const mine=p.custom?'<span class="tag mine">✏️ Tua aggiunta</span>':'';
  return `<div class="place" style="--zc:var(${zc})">
    ${p.must?'<span class="must">★ MUST</span>':''}
    ${p.custom?`<button class="delp" title="Elimina" onclick="delCustom('${p.id}')">🗑️</button>`:''}
    <div class="head">
      <span class="pbadge"><img src="${ICONS[p.icon]||ICONS.pin}" alt=""></span>
      <div><b class="nm">${esc(p.n)}</b><span class="jp">${p.jp?esc(p.jp):''}</span></div>
    </div>
    <div class="tags">${cats}${when}${mine}</div>
    ${p.d?`<p class="desc">${S(p.d)}</p>`:''}
    ${p.curio?`<details><summary>💡 Lo sapevi?</summary><p>${S(p.curio)}</p></details>`:''}
    ${p.tip?`<details open><summary>🕐 Dritta</summary><p>${S(p.tip)}</p></details>`:''}
    ${p.price?`<div class="price">💴 ${S(p.price)}</div>`:''}
    <a class="mapsbtn" target="_blank" rel="noopener" href="${mapsUrl(p.q||p.n+' '+cityName)}">🗺️ Apri in Google Maps</a>
  </div>`;
}

function viewHome(){
  const custom=loadCustom();
  const tot=DATA.cities.reduce((a,c)=>a+c.zones.reduce((b,z)=>b+z.places.length,0),0)+custom.length;
  app.innerHTML=`<div class="view">
   <div class="hero"><div class="herotop"><button class="themebtn" onclick="cycleTheme()" title="Tema">${themeIcon()}</button></div>
   <div class="flag"></div><h1>GIAPPONE</h1><p>La tua guida · estate · ${tot} luoghi salvati</p></div>
   <div class="searchwrap"><input id="q" type="search" placeholder="Cerca un luogo (es. ramen, torii, wagyu...)" value="${esc(state.q)}"></div>
   <div class="grid" id="home"></div>
   <footer>Costruita dalla tua guida PDF · mappe → Google Maps<br>Filtra per tipo e orario dentro ogni zona 🌅🌙</footer></div>`;
  const home=document.getElementById('home');
  const q=state.q.trim().toLowerCase();
  if(q.length>1){
    let out='';
    for(const c of DATA.cities)for(const z of c.zones)for(const p of z.places){
      if((p.n+' '+(p.jp||'')+' '+p.d).toLowerCase().includes(q))
        out+=placeCard(p,z.c,c.name);
    }
    for(const p of custom){
      if((p.n+' '+(p.jp||'')+' '+(p.d||'')).toLowerCase().includes(q)){
        const [cc,zz]=findZone(p.zoneId);
        out+=placeCard(p, zz?zz.c:'--tokyo', cc?cc.name:'');
      }
    }
    home.innerHTML=out||'<div class="empty">Nessun risultato 🍥</div>';
  } else {
    home.innerHTML=DATA.cities.map(c=>{
      const im=ph('city_'+c.id);
      if(im) return `<div class="citycard hasimg" style="--c:${c.color}" onclick="nav('#/${c.id}')">
        <div class="imgside" style="background-image:url('${im.src}')"></div>
        <div class="txt"><b>${c.name} <span class="jp" style="font-weight:400;font-size:14px;color:var(--grey)">${c.jp}</span></b>
        <div class="d">${c.desc}</div>
        <div class="n">${c.zones.length} zone · ${c.zones.reduce((a,z)=>a+z.places.length,0)} luoghi →</div></div>
      </div>`;
      return `<div class="citycard" style="--c:${c.color}" onclick="nav('#/${c.id}')">
        <div class="glyph jp">${c.jp.slice(0,2)}</div>
        <div><b>${c.name}</b><div class="d">${c.desc}</div>
        <div class="n">${c.zones.length} zone · ${c.zones.reduce((a,z)=>a+z.places.length,0)} luoghi →</div></div>
      </div>`}).join('');
  }
  const inp=document.getElementById('q');
  inp.addEventListener('input',()=>{state.q=inp.value;viewHome();
    const i2=document.getElementById('q');i2.focus();i2.setSelectionRange(i2.value.length,i2.value.length)});
}

function viewCity(cid){
  const c=findCity(cid); if(!c)return nav('#/');
  app.innerHTML=`<div class="view">${header(c.name+' <span class="jp" style="font-weight:400">'+c.jp+'</span>',c.desc,'#/')}
   <div class="grid">${c.zones.map(z=>{
     const im=ph(z.id);
     return `<div class="citycard zonecard" style="--c:var(${z.c})" onclick="nav('#/${c.id}/${z.id}')">
       ${im?`<div class="thumb" style="background-image:url('${im.src}')"></div>`:`<div class="glyph jp">${z.jp.slice(0,2)}</div>`}
       <div><b>${z.name}</b><div class="d">${z.sub}</div>
       <div class="n">${z.places.length} luoghi →</div></div>
     </div>`}).join('')}</div></div>`;
}

function viewZone(cid,zid){
  const c=findCity(cid); const [c2,z]=findZone(zid);
  if(!c||!z)return nav('#/');
  const all=[...z.places, ...customFor(cid,zid)];
  const filt=all.filter(p=>
    (!state.cat||(p.cat||[]).includes(state.cat)) &&
    (!state.when||(p.when||[]).includes(state.when)));
  app.innerHTML=`<div class="view">
   ${header(z.name,c.name,'#/'+c.id)}
   <div class="filters" style="--zc:var(${z.c})">
     <div class="chiprow">
       <button class="chip ${!state.cat?'on':''}" onclick="setCat(null)">Tutto</button>
       ${CATS.map(([k,l])=>`<button class="chip ${state.cat===k?'on':''}" onclick="setCat('${k}')">${l}</button>`).join('')}
     </div>
     <div class="chiprow">
       <button class="chip ${!state.when?'on':''}" onclick="setWhen(null)">Qualsiasi ora</button>
       ${WHENS.map(([k,l])=>`<button class="chip ${state.when===k?'on':''}" onclick="setWhen('${k}')">${l}</button>`).join('')}
     </div>
     <div class="fhint">🌅 mattina = fresco e poca folla · 🌙 sera = neon e temperature ok</div>
   </div>
   ${(()=>{const im=ph(z.id);return `<div class="zbanner" style="--zc:var(${z.c})">
     ${im?`<div class="bg" style="background-image:url('${im.src}')"></div><div class="shade"></div><span class="credit">📷 ${im.credit}</span>`:''}
     <div class="in"><h2>${z.name} <span class="jp" style="font-weight:400;font-size:15px">${z.jp}</span></h2>
     <div class="sub">${z.sub}</div>
     <a class="zmaps" target="_blank" rel="noopener" href="${mapsUrl(z.q)}">🗺️ Apri la zona in Maps</a></div>
   </div>`})()}
   <div class="count">${filt.length} luoghi ${state.cat||state.when?'(filtrati)':''}</div>
   <div class="grid">${filt.map(p=>placeCard(p,z.c,c.name)).join('')||'<div class="empty">Niente con questi filtri qui 🎏<br>Prova ad allargare.</div>'}</div>
  </div>`;
}
window.setCat=v=>{state.cat=(state.cat===v?null:v);render()};
window.setWhen=v=>{state.when=(state.when===v?null:v);render()};

function render(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(h.length===0)viewHome();
  else if(h.length===1)viewCity(h[0]);
  else viewZone(h[0],h[1]);
}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
