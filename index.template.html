<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2693E">
<title>Giappone · Guida</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#26252A; --paper:#FAF6EF; --grey:#837C72; --bg:#FFFFFF; --card:#FFFFFF; --line:#E8E2D8;
  --tokyo:#C2693E; --kyoto:#6E8B4F; --osaka:#BC5B39; --okinawa:#2E8C92;
  --akiba:#6F5274; --shibuya:#2F7E78; --harajuku:#C26B82; --shinjuku:#C2693E; --ginza:#AE8A3C;
  --ueno:#5E7D52; --odaiba:#3F7CA0; --minato:#B24A43; --setagaya:#B07645; --kamakura:#3A6E66;
  --fushimi:#C0613B; --naha:#C98A3A;
}
/* tema scuro: automatico (in base al sistema) o forzato con data-theme */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#ECE8E1; --paper:#17161A; --grey:#9A938A; --bg:#131217; --card:#1E1D23; --line:#312F38; }
}
:root[data-theme="dark"]{ --ink:#ECE8E1; --paper:#17161A; --grey:#9A938A; --bg:#131217; --card:#1E1D23; --line:#312F38; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",Roboto,-apple-system,"Noto Sans",sans-serif; font-size:16px}
.jp{font-family:"Yu Gothic","Noto Sans CJK JP","Hiragino Sans",sans-serif}
#app{max-width:640px; margin:0 auto; min-height:100vh; padding-bottom:100px}
a{color:inherit}
body.noscroll{overflow:hidden}

/* ---------- header ---------- */
.tophead{position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--bg) 86%, transparent); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px}
.tophead .back{border:0; background:var(--card); border:1px solid var(--line); color:var(--ink);
  width:38px; height:38px; border-radius:12px; font-size:19px; cursor:pointer; flex:0 0 auto}
.tophead h1{font-size:18px; margin:0; font-weight:700; line-height:1.15}
.tophead .sub{font-size:12px; color:var(--grey); margin-top:1px}
.crumb{flex:1; min-width:0}
.crumb h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* ---------- hero home ---------- */
.hero{padding:34px 20px 10px; text-align:center}
.hero .flag{width:56px;height:56px;border-radius:50%;background:#B24A43;margin:0 auto 12px;
  box-shadow:0 0 0 6px color-mix(in srgb,#B24A43 18%,transparent)}
.hero h1{font-size:30px; margin:0; letter-spacing:1px}
.hero p{color:var(--grey); margin:6px 0 0; font-size:14px}
.searchwrap{padding:16px 16px 4px}
.searchwrap input{width:100%; padding:12px 16px; border-radius:14px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font-size:15px; outline:none}
.searchwrap input:focus{border-color:var(--tokyo)}

/* ---------- cards ---------- */
.grid{padding:12px 14px; display:flex; flex-direction:column; gap:12px}
.citycard{display:flex; align-items:center; gap:14px; padding:16px; border-radius:18px; border:1px solid var(--line);
  background:var(--card); cursor:pointer; transition:transform .08s; position:relative; overflow:hidden}
.citycard:active{transform:scale(.98)}
.citycard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c)}
.citycard .glyph{font-size:30px; width:58px; height:58px; border-radius:16px; background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c); display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 auto}
.citycard b{font-size:19px}
.citycard .d{font-size:13px; color:var(--grey); margin-top:2px; line-height:1.35}
.citycard .n{font-size:11.5px; color:var(--c); font-weight:700; margin-top:5px}
.zonecard{border-radius:16px}
.zonecard .glyph{font-size:15px}

/* ---------- filter bar ---------- */
.filters{position:sticky; top:59px; z-index:40; background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px); padding:10px 14px 8px; border-bottom:1px solid var(--line)}
.chiprow{display:flex; gap:7px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:600; cursor:pointer}
.chip.on{background:var(--zc,var(--tokyo)); border-color:var(--zc,var(--tokyo)); color:#fff}
.fhint{font-size:11px; color:var(--grey); margin:2px 2px 0}

/* ---------- place card ---------- */
.place{border:1px solid var(--line); border-left:4px solid var(--zc); border-radius:16px;
  background:var(--card); padding:14px 14px 12px; position:relative}
.place .head{display:flex; gap:11px; align-items:flex-start}
.pbadge{width:42px; height:42px; border-radius:50%; background:var(--zc); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center}
.pbadge img{width:24px; height:24px; display:block}
.place b.nm{font-size:16.5px; display:block; line-height:1.25}
.place .jp{font-size:12px; color:var(--grey)}
.place .must{position:absolute; top:-9px; right:12px; background:var(--zc); color:#fff; font-size:10.5px;
  font-weight:800; border-radius:999px; padding:3px 9px; letter-spacing:.5px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 0}
.tag{font-size:11px; font-weight:700; border-radius:6px; padding:2.5px 7px;
  background:color-mix(in srgb,var(--zc) 12%,transparent); color:var(--zc)}
.tag.t{background:color-mix(in srgb,var(--grey) 14%,transparent); color:var(--grey)}
.place p.desc{margin:9px 0 0; font-size:14px; line-height:1.5}
.place details{margin-top:7px; font-size:13.5px; line-height:1.45}
.place details summary{cursor:pointer; color:var(--zc); font-weight:700; font-size:13px; user-select:none}
.place details p{margin:5px 0 0; color:var(--ink)}
.price{margin-top:8px; font-size:13px; background:color-mix(in srgb,var(--zc) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--zc) 25%,transparent); border-radius:9px; padding:6px 10px}
.mapsbtn{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:11px;
  background:var(--zc); color:#fff; text-decoration:none; font-weight:700; font-size:14.5px;
  border-radius:12px; padding:11px; transition:filter .1s}
.mapsbtn:active{filter:brightness(.9)}
.zonehead{margin:14px 14px 0; border-radius:18px; background:var(--zc); color:#fff; padding:16px}
.zonehead .jp{color:rgba(255,255,255,.75); font-size:13px}
.zonehead h2{margin:0 0 2px; font-size:21px}
.zonehead .sub{font-size:13px; color:rgba(255,255,255,.85); line-height:1.4}
.zonehead a.zmaps{display:inline-flex; align-items:center; gap:6px; margin-top:10px; color:#fff; background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.45); text-decoration:none; font-size:13px; font-weight:700; border-radius:999px; padding:6px 13px}
.empty{padding:40px 20px; text-align:center; color:var(--grey); font-size:14px}
.count{padding:6px 16px 0; font-size:12px; color:var(--grey)}

/* ---------- foto ---------- */
.citycard.hasimg{padding:0; min-height:118px; align-items:stretch}
.citycard.hasimg .imgside{flex:0 0 118px; background-size:cover; background-position:center}
.citycard.hasimg .txt{padding:14px 14px 12px; flex:1; min-width:0}
.zonecard .thumb{flex:0 0 74px; height:74px; border-radius:14px; background-size:cover; background-position:center; margin:0}
.zbanner{margin:14px 14px 0; border-radius:18px; overflow:hidden; position:relative; color:#fff;
  background:var(--zc); min-height:150px; display:flex; align-items:flex-end}
.zbanner .bg{position:absolute; inset:0; background-size:cover; background-position:center}
.zbanner .shade{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.62))}
.zbanner .in{position:relative; padding:14px 16px; width:100%}
.zbanner h2{margin:0 0 2px; font-size:22px; text-shadow:0 1px 8px rgba(0,0,0,.5)}
.zbanner .jp{color:rgba(255,255,255,.85); font-size:13px}
.zbanner .sub{font-size:13px; color:rgba(255,255,255,.92); line-height:1.4; text-shadow:0 1px 6px rgba(0,0,0,.6)}
.zbanner a.zmaps{display:inline-flex; align-items:center; gap:6px; margin-top:9px; color:#fff; background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.5); text-decoration:none; font-size:13px; font-weight:700; border-radius:999px; padding:6px 13px}
.credit{position:absolute; top:8px; right:10px; font-size:9.5px; color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.35); border-radius:6px; padding:2px 6px}

/* ---------- toggle tema ---------- */
.themebtn{border:1.5px solid var(--line); background:var(--card); color:var(--ink); width:38px; height:38px;
  border-radius:12px; font-size:17px; cursor:pointer; flex:0 0 auto}
.herotop{position:absolute; top:12px; right:14px}
.hero{position:relative}

/* ---------- FAB + aggiungi luogo ---------- */
.fab{position:fixed; right:18px; bottom:22px; z-index:120; width:60px; height:60px; border-radius:50%;
  border:0; background:var(--tokyo); color:#fff; font-size:33px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,.30)}
.fab:active{transform:scale(.93)}
.delp{position:absolute; top:9px; right:10px; background:transparent; border:0; font-size:17px; cursor:pointer; opacity:.55; padding:2px}
.delp:active{opacity:1}
.tag.mine{background:color-mix(in srgb,var(--zc) 20%,transparent); color:var(--zc)}
.modal{position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg); width:100%; max-width:640px; max-height:92vh; overflow:auto;
  border-radius:22px 22px 0 0; padding:16px 16px 22px; animation:sheetup .24s ease}
@keyframes sheetup{from{transform:translateY(100%)} to{transform:none}}
.sheet h2{margin:2px 0 6px; font-size:20px}
.sheet label{display:block; font-size:12.5px; font-weight:700; color:var(--grey); margin:13px 2px 5px}
.sheet input,.sheet textarea,.sheet select{width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--card); color:var(--ink); font-size:15px; font-family:inherit; outline:none}
.sheet textarea{min-height:62px; resize:vertical}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{border-color:var(--tokyo)}
.formchips{display:flex; flex-wrap:wrap; gap:7px}
.formrow{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; position:sticky; bottom:-22px;
  background:var(--bg); padding:12px 0 0}
.btn{border:0; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:700; cursor:pointer}
.btn.ghost{background:transparent; color:var(--grey)}
.btn.save{background:var(--tokyo); color:#fff}
footer{margin-top:34px; text-align:center; font-size:11.5px; color:var(--grey); padding:0 20px; line-height:1.6}
.view{animation:slidein .22s ease}
@keyframes slidein{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

/* ============ SEZIONE SPESE ============ */
:root{--sp:#3E8E63}
:root[data-theme="dark"]{--sp:#4FB07C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sp:#4FB07C}}
/* accesso dalla home */
.sp-entry{display:flex; align-items:center; gap:14px; margin:2px 14px 0; padding:15px 16px; border-radius:18px; cursor:pointer;
  background:linear-gradient(135deg,color-mix(in srgb,var(--sp) 20%,var(--card)),var(--card));
  border:1px solid color-mix(in srgb,var(--sp) 35%,var(--line)); position:relative; overflow:hidden; transition:transform .08s}
.sp-entry:active{transform:scale(.98)}
.sp-entry .ic{font-size:26px; width:52px; height:52px; border-radius:15px; display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb,var(--sp) 20%,transparent); flex:0 0 auto}
.sp-entry b{font-size:17px; display:block}
.sp-entry .d{font-size:12.5px; color:var(--grey); margin-top:2px}
.sp-entry .amt{margin-left:auto; text-align:right; font-weight:800; color:var(--sp); font-size:16px; white-space:nowrap}
/* barra totale sticky */
.sp-topbar{position:sticky; top:59px; z-index:30; background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 16px}
.sp-total{font-size:34px; font-weight:800; letter-spacing:.3px; line-height:1}
.sp-sub{font-size:12.5px; color:var(--grey); margin-top:3px}
.sp-budget{margin-top:10px}
.sp-budget-bar{height:8px; border-radius:99px; background:color-mix(in srgb,var(--grey) 22%,transparent); overflow:hidden}
.sp-budget-bar>div{height:100%; background:var(--sp); border-radius:99px; transition:width .3s}
.sp-budget.over .sp-budget-bar>div{background:#d1544a}
.sp-budget-txt{font-size:11.5px; color:var(--grey); margin-top:4px}
.sp-budget.over .sp-budget-txt{color:#d1544a; font-weight:700}
/* barra cambio */
.sp-ratebar{margin:10px 14px 0; padding:9px 13px; border-radius:12px; background:var(--card); border:1px solid var(--line);
  font-size:12.5px; color:var(--grey); cursor:pointer; text-align:center}
.sp-ratebar u{color:var(--sp); text-decoration:none; font-weight:700}
.sp-ratebar.warn{border-color:#d1a24a; color:#b9812e; background:color-mix(in srgb,#d1a24a 12%,var(--card)); font-weight:600}
/* card generiche */
.sp-card{margin:12px 14px 0; padding:14px; border-radius:16px; background:var(--card); border:1px solid var(--line)}
.sp-card-h{font-size:12.5px; font-weight:800; color:var(--grey); margin-bottom:9px; letter-spacing:.4px; text-transform:uppercase}
.sp-settle{border-left:4px solid var(--sp)}
.sp-settle-line{font-size:16px; line-height:1.4}
.sp-owe{color:var(--sp); font-weight:800; white-space:nowrap}
.sp-settle-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.sp-settle-grid>div{background:color-mix(in srgb,var(--sp) 8%,transparent); border-radius:11px; padding:9px 10px}
.sp-settle-grid span{font-size:11px; color:var(--grey); display:block}
.sp-settle-grid b{font-size:16px; display:block; margin-top:2px}
.sp-settle-grid small{font-size:10.5px; color:var(--grey)}
/* categorie */
.sp-catrow{display:flex; align-items:center; gap:10px; margin-top:9px}
.sp-catlbl{flex:0 0 43%; font-size:13px; display:flex; justify-content:space-between; gap:6px; min-width:0}
.sp-catlbl span{color:var(--grey); font-weight:600; white-space:nowrap}
.sp-bar{flex:1; height:8px; border-radius:99px; background:color-mix(in srgb,var(--grey) 18%,transparent); overflow:hidden}
.sp-bar>div{height:100%; background:var(--sp); border-radius:99px}
.sp-catpct{flex:0 0 36px; text-align:right; font-size:11.5px; color:var(--grey)}
/* statistiche */
.sp-stats{margin:12px 14px 0; border:1px solid var(--line); border-radius:16px; background:var(--card); overflow:hidden}
.sp-stats>summary{cursor:pointer; padding:13px 14px; font-weight:700; font-size:14px; user-select:none; list-style:none}
.sp-stats>summary::-webkit-details-marker{display:none}
.sp-stats>summary::after{content:"⌄"; float:right; color:var(--grey)}
.sp-stats[open]>summary::after{content:"⌃"}
.sp-statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:4px 12px 0}
.sp-stat{background:color-mix(in srgb,var(--sp) 8%,transparent); border-radius:12px; padding:10px 11px}
.sp-stat span{font-size:11px; color:var(--grey)}
.sp-stat b{font-size:18px; display:block; margin-top:2px}
.sp-stat small{font-size:10.5px; color:var(--grey)}
.sp-stats .sp-card{margin:12px; border:0; background:transparent; padding:0}
/* gruppi giorno */
.sp-daygroup{margin:16px 14px 0}
.sp-dayhead{display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 7px; border-bottom:1.5px solid var(--line)}
.sp-dayname{font-size:14px; font-weight:800}
.sp-daytot{font-size:14px; font-weight:800; color:var(--sp)}
.sp-exp{display:flex; gap:12px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer}
.sp-exp:active{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.sp-exp-main{flex:1; min-width:0}
.sp-exp-top{display:flex; gap:6px; align-items:baseline; flex-wrap:wrap}
.sp-cat{font-size:13.5px; font-weight:700}
.sp-note{font-size:13px; color:var(--grey); overflow:hidden; text-overflow:ellipsis}
.sp-exp-who{font-size:11.5px; color:var(--grey); margin-top:3px}
.sp-exp-amt{text-align:right; flex:0 0 auto}
.sp-exp-amt b{font-size:15.5px; display:block}
.sp-exp-amt small{font-size:10.5px; color:var(--grey); white-space:nowrap}
.sp-empty{margin:44px 20px; text-align:center; color:var(--grey); font-size:14.5px; line-height:1.7; cursor:pointer}
.sp-muted{color:var(--grey); font-size:12px}
.sp-setbtn{display:block; width:calc(100% - 28px); margin:18px 14px 0; background:var(--card); border:1px solid var(--line); color:var(--grey)}
/* form spesa */
.sp-amtrow{display:flex; gap:11px}
.sp-amtrow>div{flex:1}
.sp-amtrow input{font-size:22px; font-weight:800; text-align:right; padding:12px 13px}
.sp-rateline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--grey)}
.sp-rateline input{width:120px; padding:8px 10px; font-size:14px}
.sp-namerow{display:flex; gap:11px}
.sp-namerow>div{flex:1}
.sp-set-rate{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-top:5px}
.sp-mini{padding:7px 13px; font-size:13px; border:1px solid var(--line); background:var(--card); color:var(--sp)}
.sp-backup{display:flex; gap:8px}
.sp-backup .btn{flex:1; border:1px solid var(--line); background:var(--card); font-size:13.5px; padding:11px 6px}
.sp-sheet .chip.on{background:var(--sp); border-color:var(--sp); color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab" class="fab" title="Aggiungi" onclick="onFab()">+</button>
<div id="modal" class="modal" hidden onclick="closeAdd()"></div>
<script>
/* ============ ICONE (PNG bianche della guida, base64) ============ */
const ICONS = {
  torii:"@@ICON_torii@@", shop:"@@ICON_shop@@", camera:"@@ICON_camera@@", cup:"@@ICON_cup@@",
  yen:"@@ICON_yen@@", walk:"@@ICON_walk@@", train:"@@ICON_train@@", bulb:"@@ICON_bulb@@",
  pin:"@@ICON_pin@@", star:"@@ICON_star@@", clock:"@@ICON_clock@@", station:"@@ICON_station@@"
};

/* ============ DATABASE (estratto dalla guida PDF) ============ */
/* cat: cibo | visita | shopping | chicca   ·   when: mattina | giorno | sera */
const P=(icon,n,jp,cat,when,d,o={})=>({icon,n,jp,cat,when,d,...o});
const DATA={cities:[
{id:'tokyo',name:'Tokyo',jp:'東京',color:'var(--tokyo)',hex:'#C2693E',
 desc:'La megalopoli: otaku, neon, templi e parchi.',zones:[
 {id:'akiba',name:'Akihabara',jp:'秋葉原',c:'--akiba',sub:'Elettronica, retrogaming e cultura otaku. Meglio nel tardo pomeriggio, quando si accendono le insegne.',q:'Akihabara Electric Town Tokyo',places:[
  P('torii','Akihabara Electric Town','秋葉原電気街',['visita'],['sera'],'Palazzi di 7–8 piani stipati di elettronica, anime e sale giochi. Al buio le insegne trasformano la via.',{must:1,curio:'Nel dopoguerra qui c’era il mercato nero dei componenti radio: da lì "Electric Town".',q:'Akihabara Electric Town'}),
  P('shop','Super Potato','スーパーポテト',['shopping'],['giorno'],'La mecca del retrogaming: tre piani di console e cartucce dagli anni ’80, con sala arcade vintage in cima.',{q:'Super Potato Akihabara'}),
  P('shop','Mandarake Complex','まんだらけ',['shopping'],['giorno'],'Otto piani di manga, figure, dōjinshi e cimeli usati.',{q:'Mandarake Complex Akihabara'}),
  P('shop','Yodobashi Akiba','ヨドバシAkiba',['shopping'],['giorno'],'Megastore di nove piani. Aria condizionata salvavita nelle ore calde; chiedi la point card (10%).',{tip:'Nello stesso edificio: ABC-MART Mega e UNIQLO.',q:'Yodobashi Akiba'}),
  P('shop','Don Quijote Akihabara','ドン・キホーテ',['shopping'],['sera'],'Il labirinto del "Donki": souvenir assurdi e cosmetici fino a tardi. In alto il teatro delle AKB48.',{q:'Don Quijote Akihabara'}),
  P('torii','Kanda Myōjin','神田明神',['visita','chicca'],['mattina'],'Il santuario che "benedice" i dispositivi elettronici, a 7 minuti dalla via principale.',{q:'Kanda Myojin Tokyo'}),

/* ============ TEMA ============ */
function applyTheme(){
  const t=localStorage.getItem('theme')||'auto';
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
}
function cycleTheme(){
  const cur=localStorage.getItem('theme')||'auto';
  const next=cur==='auto'?'light':(cur==='light'?'dark':'auto');
  localStorage.setItem('theme',next); applyTheme(); render();
}
const themeIcon=()=>({auto:'🌗',light:'☀️',dark:'🌙'})[localStorage.getItem('theme')||'auto'];
applyTheme();

function loadCustom(){try{return JSON.parse(localStorage.getItem('myplaces')||'[]')}catch(e){return[]}}
function saveCustom(a){localStorage.setItem('myplaces',JSON.stringify(a))}
function customFor(cid,zid){return loadCustom().filter(p=>p.cityId===cid&&p.zoneId===zid)}
window.delCustom=id=>{if(confirm('Eliminare questo luogo aggiunto da te?')){saveCustom(loadCustom().filter(p=>p.id!==id));render()}};
window.fcToggle=el=>el.classList.toggle('on');
function zoneOptions(sc,sz){
  return DATA.cities.map(c=>`<optgroup label="${c.name}">`+
    c.zones.map(z=>`<option value="${c.id}|${z.id}"${(c.id===sc&&z.id===sz)?' selected':''}>${z.name}</option>`).join('')+
    `</optgroup>`).join('');
}

/* ============================================================
   ============  MODULO SPESE DI VIAGGIO  =====================
   ============================================================ */
const SP_KEY='spese_v1', RATE_KEY='spese_rate_v1', CFG_KEY='spese_cfg_v1';
const SPCATS=[['cibo','🍜 Cibo'],['trasporti','🚃 Trasporti'],['alloggio','🏨 Alloggio'],
  ['shopping','🛍️ Shopping'],['attrazioni','🎫 Attrazioni'],['varie','✨ Varie']];

/* ---- storage ---- */
function loadSpese(){try{return JSON.parse(localStorage.getItem(SP_KEY)||'[]')}catch(e){return[]}}
function saveSpese(a){localStorage.setItem(SP_KEY,JSON.stringify(a))}
function cachedRate(){try{return JSON.parse(localStorage.getItem(RATE_KEY)||'null')}catch(e){return null}}
function cfg(){const d={manualRate:0,budget:0,tripDays:0,nomeA:'Io',nomeB:'Morosa'};
  try{return Object.assign(d,JSON.parse(localStorage.getItem(CFG_KEY)||'{}'))}catch(e){return d}}
function saveCfg(o){localStorage.setItem(CFG_KEY,JSON.stringify(o))}

/* ---- formattazione italiana ---- */
const fmtNum=(n,d=2)=>new Intl.NumberFormat('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const eur=n=>fmtNum(n,2)+' €';
const jpy=n=>fmtNum(n,0)+' ¥';
const capit=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function parseNum(s){ if(typeof s==='number')return s; s=(''+(s||'')).trim(); if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');   // formato IT: punto=migliaia, virgola=decimali
  const n=parseFloat(s.replace(/[^\d.\-]/g,'')); return isFinite(n)?n:0; }
function numIn(n){ return (n==null||n===''||n===0)?'':(''+n).replace('.',','); }
function todayISO(){const d=new Date(),z=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function fmtDay(iso){try{return new Date(iso+'T00:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long'});}catch(e){return iso}}
function agoTxt(ts){ if(!ts)return'mai'; const s=(Date.now()-ts)/1000;
  if(s<90)return'poco fa'; const m=s/60; if(m<90)return Math.round(m)+' min fa';
  const h=m/60; if(h<36)return Math.round(h)+' ore fa'; return Math.round(h/24)+' giorni fa'; }

/* ---- calcolo: i due importi SI SOMMANO, tasso congelato per spesa ---- */
function espTot(e){ return (e.importoEur||0) + (e.importoJpy||0)*(e.tassoUsato||0); }

/* ---- cambio ¥→€: manuale ha priorità, poi cache, poi niente ---- */
function effRate(){ const c=cfg();
  if(c.manualRate>0) return {rate:c.manualRate, source:'manuale'};
  const cr=cachedRate();
  if(cr&&cr.rate>0) return {rate:cr.rate, source:'auto', fetchedAt:cr.fetchedAt, date:cr.date};
  return null; }
function fetchRate(){
  return fetch('https://api.frankfurter.app/latest?from=JPY&to=EUR').then(r=>{
    if(!r.ok)throw 0; return r.json();
  }).then(j=>{ const rate=j&&j.rates&&j.rates.EUR; if(!(rate>0))throw 0;
    const rec={rate, date:j.date, fetchedAt:Date.now()};
    localStorage.setItem(RATE_KEY,JSON.stringify(rec)); return rec; });
}
let _rateTried=false;
function maybeRefreshRate(){
  if(_rateTried)return; _rateTried=true;
  if(cfg().manualRate>0)return;               // override manuale: non serve la rete
  if(!navigator.onLine)return;
  fetchRate().then(()=>{ if((location.hash.replace(/^#\/?/,'').split('/')[0])==='spese')render(); }).catch(()=>{});
}

/* ---- FAB contestuale ---- */
window.onFab=()=>{
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(h[0]==='spese') openSpesa(); else openAdd();
};
window.segPick=(el,sel)=>{ document.querySelectorAll(sel+' .chip').forEach(c=>c.classList.remove('on')); el.classList.add('on'); };

/* ---- vista spese ---- */
function viewSpese(){
  maybeRefreshRate();
  const exps=loadSpese(), c=cfg();
  const tot=exps.reduce((a,e)=>a+espTot(e),0);
  const nd=new Set(exps.map(e=>e.data)).size;
  app.innerHTML=`<div class="view">
   ${header('💴 Spese di viaggio', exps.length+' spese · '+nd+(nd===1?' giorno':' giorni'), '#/')}
   <div class="sp-topbar">
     <div class="sp-total">${eur(tot)}</div>
     <div class="sp-sub">Totale del viaggio, convertito in euro</div>
     ${budgetBar(tot,c.budget)}
   </div>
   ${rateBar()}
   ${settlementCard(exps,c)}
   ${statsBlock(exps,c)}
   ${dayGroups(exps)}
   <button class="btn sp-setbtn" onclick="openSpeseSettings()">⚙️ Impostazioni · cambio · backup</button>
   <div style="height:24px"></div>
  </div>`;
}
function budgetBar(tot,b){ if(!(b>0))return'';
  const pct=Math.min(100,tot/b*100), over=tot>b;
  return `<div class="sp-budget ${over?'over':''}">
    <div class="sp-budget-bar"><div style="width:${pct}%"></div></div>
    <div class="sp-budget-txt">${eur(tot)} / ${eur(b)} · ${over?'sforato di '+eur(tot-b):'restano '+eur(b-tot)}</div>
  </div>`; }
function rateBar(){ const er=effRate();
  if(!er) return `<div class="sp-ratebar warn" onclick="openSpeseSettings()">⚠️ Nessun cambio impostato — tocca per inserirlo</div>`;
  const inv=fmtNum(1/er.rate,0);
  const info = er.source==='manuale'
    ? `1 € = ${inv} ¥ · cambio manuale · <u>modifica</u>`
    : `1 € = ${inv} ¥ · aggiornato ${agoTxt(er.fetchedAt)} · <u>impostazioni</u>`;
  return `<div class="sp-ratebar" onclick="openSpeseSettings()">💱 ${info}</div>`;
}
function settlementCard(exps,c){ if(!exps.length)return'';
  let paidA=0,paidB=0,shA=0,shB=0;
  for(const e of exps){ const t=espTot(e);
    if(e.pagatoDa==='B')paidB+=t; else paidA+=t;
    if(e.divisa==='A')shA+=t; else if(e.divisa==='B')shB+=t; else {shA+=t/2; shB+=t/2;} }
  const balA=paidA-shA;   // >0 ⇒ A ha anticipato, gli è dovuto
  let line;
  if(Math.abs(balA)<0.01) line=`<b>Siete in pari</b> 🤝`;
  else if(balA>0) line=`<b>${esc(c.nomeB)}</b> deve a <b>${esc(c.nomeA)}</b> <span class="sp-owe">${eur(balA)}</span>`;
  else line=`<b>${esc(c.nomeA)}</b> deve a <b>${esc(c.nomeB)}</b> <span class="sp-owe">${eur(-balA)}</span>`;
  return `<div class="sp-card sp-settle">
    <div class="sp-card-h">🤝 Chi deve a chi</div>
    <div class="sp-settle-line">${line}</div>
    <div class="sp-settle-grid">
      <div><span>${esc(c.nomeA)} ha pagato</span><b>${eur(paidA)}</b><small>sua parte: ${eur(shA)}</small></div>
      <div><span>${esc(c.nomeB)} ha pagato</span><b>${eur(paidB)}</b><small>sua parte: ${eur(shB)}</small></div>
    </div>
  </div>`;
}
function statsBlock(exps,c){ if(!exps.length)return'';
  const tot=exps.reduce((a,e)=>a+espTot(e),0);
  const nd=new Set(exps.map(e=>e.data)).size||1;
  const avg=tot/nd, proj=c.tripDays>0?avg*c.tripDays:null;
  const by={}; for(const e of exps){const k=e.categoria||'varie'; by[k]=(by[k]||0)+espTot(e);}
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const l=(SPCATS.find(x=>x[0]===k)||[,k])[1], pct=tot?v/tot*100:0;
    return `<div class="sp-catrow"><div class="sp-catlbl">${l}<span>${eur(v)}</span></div>
      <div class="sp-bar"><div style="width:${pct.toFixed(1)}%"></div></div>
      <div class="sp-catpct">${fmtNum(pct,0)}%</div></div>`;
  }).join('');
  return `<details class="sp-stats"><summary>📊 Statistiche e riepilogo</summary>
    <div class="sp-statgrid">
      <div class="sp-stat"><span>Media al giorno</span><b>${eur(avg)}</b><small>su ${nd} ${nd===1?'giorno':'giorni'}</small></div>
      <div class="sp-stat"><span>${proj!=null?'Proiezione '+c.tripDays+' gg':'Totale finora'}</span><b>${eur(proj!=null?proj:tot)}</b>${c.budget>0?`<small>budget ${eur(c.budget)}</small>`:''}</div>
    </div>
    <div class="sp-card"><div class="sp-card-h">🧾 Per categoria</div>${cats}</div>
  </details>`;
}
function dayGroups(exps){
  if(!exps.length) return `<div class="sp-empty" onclick="openSpesa()">Ancora nessuna spesa.<br>Tocca <b>+</b> per aggiungere la prima 💴</div>`;
  const g={}; for(const e of exps){(g[e.data]=g[e.data]||[]).push(e);}
  return Object.keys(g).sort().reverse().map(d=>{
    const items=g[d].slice().sort((a,b)=>b.createdAt-a.createdAt);
    const sub=items.reduce((a,e)=>a+espTot(e),0);
    return `<div class="sp-daygroup">
      <div class="sp-dayhead"><span class="sp-dayname">${capit(fmtDay(d))}</span><span class="sp-daytot">${eur(sub)}</span></div>
      ${items.map(espRow).join('')}
    </div>`;
  }).join('');
}
function espRow(e){ const c=cfg();
  const cat=(SPCATS.find(x=>x[0]===e.categoria)||[,'✨ Varie'])[1];
  const who=e.pagatoDa==='B'?c.nomeB:c.nomeA;
  const div=e.divisa==='A'?('solo '+c.nomeA):e.divisa==='B'?('solo '+c.nomeB):'metà e metà';
  const bits=[]; if(e.importoEur)bits.push(eur(e.importoEur)); if(e.importoJpy)bits.push(jpy(e.importoJpy));
  const show=e.importoJpy>0||bits.length>1;
  return `<div class="sp-exp" onclick="openSpesa('${e.id}')">
    <div class="sp-exp-main">
      <div class="sp-exp-top"><span class="sp-cat">${cat}</span>${e.nota?`<span class="sp-note">· ${esc(e.nota)}</span>`:''}</div>
      <div class="sp-exp-who">💳 ${esc(who)} · ${div}</div>
    </div>
    <div class="sp-exp-amt"><b>${eur(espTot(e))}</b>${show?`<small>${bits.join(' + ')}</small>`:''}</div>
  </div>`;
}

/* ---- form nuova / modifica spesa ---- */

  const editing = id ? loadSpese().find(e=>e.id===id) : null;
  const c=cfg(), er=effRate();
  const rate = editing ? editing.tassoUsato : (er?er.rate:'');
  const sel=(cond)=>cond?'on':'';
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="sheet sp-sheet" onclick="event.stopPropagation()">
    <h2>${editing?'✏️ Modifica spesa':'➕ Nuova spesa'}</h2>
    <div class="sp-amtrow">
      <div><label>Yen ¥</label><input id="s_jpy" inputmode="decimal" placeholder="0" value="${editing?numIn(editing.importoJpy):''}"></div>
      <div><label>Euro €</label><input id="s_eur" inputmode="decimal" placeholder="0" value="${editing?numIn(editing.importoEur):''}"></div>
    </div>
    <div class="sp-rateline">Cambio ¥→€ usato: <input id="s_rate" inputmode="decimal" placeholder="es. 0,0064" value="${rate}"> ${(!editing&&!er)?'<span class="sp-muted">nessun cambio salvato: inseriscilo</span>':''}</div>
    <label>Categoria</label>
    <div class="formchips" id="s_cat">${SPCATS.map(([k,l])=>`<button type="button" class="chip ${sel(((editing&&editing.categoria)||'varie')===k)}" data-v="${k}" onclick="segPick(this,'#s_cat')">${l}</button>`).join('')}</div>
    <label>Chi ha pagato?</label>
    <div class="formchips" id="s_pay">
      <button type="button" class="chip ${sel(!editing||editing.pagatoDa!=='B')}" data-v="A" onclick="segPick(this,'#s_pay')">💳 ${esc(c.nomeA)}</button>
      <button type="button" class="chip ${sel(editing&&editing.pagatoDa==='B')}" data-v="B" onclick="segPick(this,'#s_pay')">💳 ${esc(c.nomeB)}</button>
    </div>
    <label>Come si divide?</label>
    <div class="formchips" id="s_split">
      <button type="button" class="chip ${sel(!editing||!editing.divisa||editing.divisa==='entrambi')}" data-v="entrambi" onclick="segPick(this,'#s_split')">🤝 Metà e metà</button>
      <button type="button" class="chip ${sel(editing&&editing.divisa==='A')}" data-v="A" onclick="segPick(this,'#s_split')">Solo ${esc(c.nomeA)}</button>
      <button type="button" class="chip ${sel(editing&&editing.divisa==='B')}" data-v="B" onclick="segPick(this,'#s_split')">Solo ${esc(c.nomeB)}</button>
    </div>
    <label>Data</label><input id="s_date" type="date" value="${editing?editing.data:todayISO()}">
    <label>Nota (facoltativa)</label><input id="s_note" placeholder="Es. ramen a Shinjuku" value="${editing?esc(editing.nota||''):''}">
    <div class="formrow">
      ${editing?`<button class="btn ghost" style="margin-right:auto;color:#d1544a" onclick="delSpesa('${editing.id}')">🗑️ Elimina</button>`:''}
      <button class="btn ghost" onclick="closeAdd()">Annulla</button>
      <button class="btn save" style="background:var(--sp)" onclick="saveSpesa('${editing?editing.id:''}')">Salva</button>
    </div>
  </div>`;
  m.hidden=false; document.body.classList.add('noscroll');
  setTimeout(()=>{const j=document.getElementById('s_jpy'); if(j)j.focus();},80);   // focus su ¥: valuta d'uso quotidiano
};
window.saveSpesa=(id)=>{
  const jv=parseNum(document.getElementById('s_jpy').value);
  const ev=parseNum(document.getElementById('s_eur').value);
  const rate=parseNum(document.getElementById('s_rate').value);
  if(jv<=0 && ev<=0){ alert('Inserisci almeno un importo (¥ o €) 🙂'); return; }
  if(jv>0 && !(rate>0)){ alert('Serve il cambio ¥→€ per convertire gli yen.\nInseriscilo nel campo "Cambio" o nelle impostazioni.'); document.getElementById('s_rate').focus(); return; }
  const pick=sel=>{const el=document.querySelector(sel+' .chip.on'); return el?el.dataset.v:null;};
  const cat=pick('#s_cat')||'varie', pay=pick('#s_pay')||'A', split=pick('#s_split')||'entrambi';
  const data=document.getElementById('s_date').value||todayISO();
  const nota=document.getElementById('s_note').value.trim();
  const arr=loadSpese();
  if(id){ const e=arr.find(x=>x.id===id);
    if(e) Object.assign(e,{data,importoEur:ev,importoJpy:jv,tassoUsato:rate||e.tassoUsato,categoria:cat,nota,pagatoDa:pay,divisa:split}); }
  else arr.push({ id:'s'+Date.now()+Math.random().toString(36).slice(2,6),
    data, importoEur:ev, importoJpy:jv, tassoUsato:rate, categoria:cat, nota, pagatoDa:pay, divisa:split, createdAt:Date.now() });
  saveSpese(arr); closeAdd(); render();
};
window.delSpesa=(id)=>{ if(confirm('Eliminare questa spesa?')){ saveSpese(loadSpese().filter(e=>e.id!==id)); closeAdd(); render(); } };

/* ---- impostazioni: cambio, budget, nomi, backup ---- */
window.openSpeseSettings=()=>{
  const c=cfg(), cr=cachedRate();
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="sheet sp-sheet" onclick="event.stopPropagation()">
    <h2>⚙️ Impostazioni spese</h2>
    <label>Cambio automatico (mercato)</label>
    <div class="sp-set-rate">
      <div class="sp-muted">${cr&&cr.rate?`1 € = ${fmtNum(1/cr.rate,0)} ¥ · ${agoTxt(cr.fetchedAt)}`:'non ancora scaricato'}</div>
      <button type="button" class="btn sp-mini" onclick="refreshRateBtn(this)">🔄 Aggiorna</button>
    </div>
    <label>Cambio manuale — ha priorità (facoltativo)</label>
    <input id="c_rate" inputmode="decimal" placeholder="es. 0,0064" value="${c.manualRate?c.manualRate:''}">
    <div class="sp-muted" style="margin-top:5px">Il cambio reale di ATM/carta è di solito 2–4% peggiore del mercato: per conti realistici metti qui quello del tuo prelievo.</div>
    <label>Budget del viaggio in € (facoltativo)</label>
    <input id="c_budget" inputmode="decimal" placeholder="es. 2000" value="${c.budget?numIn(c.budget):''}">
    <label>Durata viaggio in giorni — per la proiezione (facoltativo)</label>
    <input id="c_days" inputmode="numeric" placeholder="es. 14" value="${c.tripDays?c.tripDays:''}">
    <div class="sp-namerow">
      <div><label>Nome 1</label><input id="c_na" maxlength="14" value="${esc(c.nomeA)}"></div>
      <div><label>Nome 2</label><input id="c_nb" maxlength="14" value="${esc(c.nomeB)}"></div>
    </div>
    <label>Backup dei dati (unico modo per salvarli fuori dal telefono)</label>
    <div class="sp-backup">
      <button type="button" class="btn" onclick="exportJSON()">⬇️ JSON</button>
      <button type="button" class="btn" onclick="exportCSV()">⬇️ CSV</button>
      <button type="button" class="btn" onclick="importJSON()">⬆️ Importa</button>
    </div>
    <div class="formrow">
      <button class="btn ghost" onclick="closeAdd()">Chiudi</button>
      <button class="btn save" style="background:var(--sp)" onclick="saveSpeseSettings()">Salva</button>
    </div>
  </div>`;
  m.hidden=false; document.body.classList.add('noscroll');
};
window.saveSpeseSettings=()=>{
  const c=cfg();
  c.manualRate=parseNum(document.getElementById('c_rate').value)||0;
  c.budget=parseNum(document.getElementById('c_budget').value)||0;
  c.tripDays=Math.round(parseNum(document.getElementById('c_days').value))||0;
  c.nomeA=(document.getElementById('c_na').value.trim()||'Io').slice(0,14);
  c.nomeB=(document.getElementById('c_nb').value.trim()||'Morosa').slice(0,14);
  saveCfg(c); closeAdd(); render();
};
window.refreshRateBtn=(btn)=>{ btn.textContent='…'; btn.disabled=true;
  fetchRate().then(()=>openSpeseSettings()).catch(()=>{ btn.textContent='✕ offline'; setTimeout(()=>{btn.textContent='🔄 Aggiorna'; btn.disabled=false;},1600); }); };

/* ---- export / import (backup) ---- */
function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime}), url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},120);
}
window.exportJSON=()=>{
  const data={version:1, exportedAt:new Date().toISOString(), spese:loadSpese(), config:cfg(), rate:cachedRate()};
  downloadFile('spese-giappone-'+todayISO()+'.json', JSON.stringify(data,null,2), 'application/json');
};
window.exportCSV=()=>{
  const c=cfg(), nm={A:c.nomeA,B:c.nomeB};
  const cell=v=>{v=(v==null?'':''+v); return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const n2=n=>(Math.round((n||0)*100)/100+'').replace('.',',');
  const rows=[['Data','Categoria','Nota','Euro','Yen','Cambio','Totale €','Pagato da','Diviso']];
  loadSpese().slice().sort((a,b)=>a.data.localeCompare(b.data)||a.createdAt-b.createdAt).forEach(e=>{
    const catL=(SPCATS.find(x=>x[0]===e.categoria)||[,e.categoria||''])[1].replace(/^\S+\s/,'');
    const div=e.divisa==='A'?('Solo '+c.nomeA):e.divisa==='B'?('Solo '+c.nomeB):'Metà e metà';
    rows.push([e.data,catL,e.nota||'',n2(e.importoEur),n2(e.importoJpy),(''+(e.tassoUsato||'')).replace('.',','),n2(espTot(e)),nm[e.pagatoDa]||c.nomeA,div]);
  });
  const csv='﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n');   // ; e virgola decimale = Excel italiano
  downloadFile('spese-giappone-'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8');
};
window.importJSON=()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.spese)) throw 0;
      if(!confirm('Importare '+d.spese.length+' spese?\nSostituiranno i dati attuali.')) return;
      saveSpese(d.spese);
      if(d.config) localStorage.setItem(CFG_KEY,JSON.stringify(d.config));
      if(d.rate) localStorage.setItem(RATE_KEY,JSON.stringify(d.rate));
      closeAdd(); render(); alert('Import completato ✔');
    }catch(e){ alert('File non valido 😕'); } };
    r.readAsText(f); };
  inp.click();
};

function render(){
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(h[0]==='spese') return viewSpese();
  if(h.length===0)viewHome();
  else if(h.length===1)viewCity(h[0]);
  else viewZone(h[0],h[1]);
}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
