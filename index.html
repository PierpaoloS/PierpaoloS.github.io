<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Retro Cam</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div id="app">
    <!-- Sorgente video (nascosta): il frame reale viene disegnato sul canvas -->
    <video id="cam" playsinline autoplay muted></video>

    <!-- Palcoscenico: qui viene composta l'immagine finale (camera + filtro) -->
    <canvas id="stage"></canvas>

    <!-- Barra dei controlli in alto -->
    <div id="topbar">
      <button id="flip" class="ctl" title="Cambia fotocamera" aria-label="Cambia fotocamera">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>

      <div id="switch" role="tablist" aria-label="Scegli filtro">
        <button class="seg is-active" data-filter="ui" role="tab">🎮 UI</button>
        <button class="seg" data-filter="dog" role="tab">🐶 Cane</button>
        <button class="seg" data-filter="mazz" role="tab">😎 Mazz2016</button>
      </div>

      <div class="ctl-spacer"></div>
    </div>

    <!-- Pulsante di scatto (in modalità UI è trasparente e mostra la pokéball disegnata) -->
    <button id="shutter" aria-label="Scatta foto"><span class="ring"></span></button>

    <!-- Schermata iniziale: serve un tocco per avviare la fotocamera (richiesto da iOS) -->
    <div id="start" class="overlay">
      <div class="card">
        <div class="logo">📸</div>
        <h1>Retro&nbsp;Cam</h1>
        <p>Scatti con tre filtri:<br><b>UI retro</b>, <b>filtro cane</b> e <b>Mazz2016</b>.</p>
        <button id="startBtn" class="primary">Avvia fotocamera</button>
        <small>Tutto avviene sul tuo telefono. Nessuna foto viene inviata da nessuna parte.</small>
      </div>
    </div>

    <!-- Anteprima scatto -->
    <div id="preview" class="overlay hidden">
      <img id="shot" alt="Anteprima scatto" />
      <div class="preview-actions">
        <button id="retake" class="ghost">↩︎ Rifai</button>
        <button id="save" class="primary">⬇︎ Salva</button>
      </div>
    </div>

    <!-- Messaggi di caricamento / errore -->
    <div id="toast" class="toast hidden"></div>
    <div id="err" class="overlay hidden">
      <div class="card">
        <div class="logo">🚫</div>
        <h1>Fotocamera non disponibile</h1>
        <p id="errMsg"></p>
        <button id="retry" class="primary">Riprova</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=8"></script>
</body>
</html>
